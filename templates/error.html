{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card error-card">
  <p class="eyebrow">Something went wrong</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="form-actions">
    <a class="btn primary" href="{{ url_for('dashboard') }}">Back to dashboard</a>
    <a class="btn ghost" href="{{ url_for('reports') }}">Open reports</a>
  </div>
</div>
{% endblock %}
